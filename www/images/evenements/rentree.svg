<svg width="900" height="1200" viewBox="0 0 900 1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ede5d2"/>
      <stop offset="100%" stop-color="#f4efe4"/>
    </linearGradient>

    <radialGradient id="waveGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="9%"  stop-color="#e8d5a0"/>
      <stop offset="10%" stop-color="#c4601a"/>
      <stop offset="19%" stop-color="#c4601a"/>
      <stop offset="20%" stop-color="#e8d5a0"/>
      <stop offset="29%" stop-color="#e8d5a0"/>
      <stop offset="30%" stop-color="#c4601a"/>
      <stop offset="39%" stop-color="#c4601a"/>
      <stop offset="40%" stop-color="#e8d5a0"/>
      <stop offset="49%" stop-color="#e8d5a0"/>
      <stop offset="50%" stop-color="#c4601a"/>
      <stop offset="59%" stop-color="#c4601a"/>
      <stop offset="60%" stop-color="#e8d5a0"/>
      <stop offset="69%" stop-color="#e8d5a0"/>
      <stop offset="70%" stop-color="#c4601a"/>
      <stop offset="79%" stop-color="#c4601a"/>
      <stop offset="80%" stop-color="#e8d5a0"/>
      <stop offset="89%" stop-color="#e8d5a0"/>
      <stop offset="90%" stop-color="#c4601a"/>
    </radialGradient>

    <pattern id="seigaiha" x="0" y="0" width="130" height="78" patternUnits="userSpaceOnUse">
      <circle fill="url(#waveGrad)" cx="0"   cy="35" r="74"/>
      <circle fill="url(#waveGrad)" cx="130" cy="35" r="74"/>
      <circle fill="url(#waveGrad)" cx="65"  cy="74" r="74"/>
      <circle fill="url(#waveGrad)" cx="0"   cy="113" r="74"/>
      <circle fill="url(#waveGrad)" cx="130" cy="113" r="74"/>
    </pattern>
  </defs>

  <!-- fond -->
  <rect width="900" height="1200" fill="url(#bg)"/>
  <rect width="900" height="1200" fill="url(#seigaiha)" opacity="0.10"/>

  <!-- filet supérieur -->
  <rect x="0" y="0" width="900" height="10" fill="#c4601a"/>

  <!-- kanji vertical en filigrane -->
  <text x="150" y="430" font-family="Georgia, 'Times New Roman', serif" font-size="230"
        fill="#c4601a" fill-opacity="0.16" text-anchor="middle"
        writing-mode="vertical-rl">合気道</text>

  <!-- petit losange de signature -->
  <rect x="435" y="470" width="26" height="26" fill="#c4601a" transform="rotate(45 448 483)"/>

  <!-- titre -->
  <text x="450" y="660" font-family="Georgia, 'Times New Roman', serif" font-size="172"
        font-weight="600" fill="#261e14" text-anchor="middle">Rentrée</text>

  <!-- sous-titre -->
  <text x="450" y="762" font-family="Verdana, Arial, sans-serif" font-size="40"
        fill="#c4601a" text-anchor="middle" letter-spacing="5">REPRISE DES COURS</text>

  <!-- filet -->
  <line x1="300" y1="815" x2="600" y2="815" stroke="#d8cebc" stroke-width="1"/>

  <!-- torii minimaliste -->
  <g fill="#c4601a">
    <rect x="335" y="965" width="230" height="18"/>
    <rect x="358" y="995" width="184" height="14"/>
    <rect x="368" y="995" width="20" height="150"/>
    <rect x="512" y="995" width="20" height="150"/>
  </g>
</svg>
